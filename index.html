<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blog.xkt.space</title>
  <!-- 主题样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  <!-- KaTeX 公式样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
  <div id="app"></div>

  <script>
    function renderKatex(math, displayMode) {
      if (!window.katex) return null;

      return katex.renderToString(math, {
        displayMode: displayMode,
        throwOnError: false
      });
    }

    function replaceMath(text) {
      text = text.replace(/\$\$([\s\S]+?)\$\$/g, function (_, math) {
        return renderKatex(math, true) || _;
      });

      text = text.replace(/\\\[([\s\S]+?)\\\]/g, function (_, math) {
        return renderKatex(math, true) || _;
      });

      text = text.replace(/\\\(([\s\S]+?)\\\)/g, function (_, math) {
        return renderKatex(math, false) || _;
      });

      return text.replace(/(^|[^\\])\$([^\n$]+?)\$/g, function (_, prefix, math) {
        return prefix + (renderKatex(math, false) || ('$' + math + '$'));
      });
    }

    function renderMathInMarkdown(markdown) {
      return markdown
        .split(/(```[\s\S]*?```|~~~[\s\S]*?~~~)/g)
        .map(function (block, index) {
          if (index % 2 === 1) return block;

          return block
            .split(/(`+[^`\n]*`+)/g)
            .map(function (part, partIndex) {
              return partIndex % 2 === 1 ? part : replaceMath(part);
            })
            .join('');
        })
        .join('');
    }

    window.$docsify = {
      name: '我的文档',
      repo: '',
      homepage: 'README.md',
      search: {
        placeholder: '搜索内容...',
        noData: '无匹配内容',
        pathNamespaces: '/'
      },
      subMaxLevel: 3,
      loadSidebar: true,
      auto2top: true,
      markdown: {
        smartypants: true
      },
      plugins: [
        function (hook) {
          hook.beforeEach(function (markdown, next) {
            next(renderMathInMarkdown(markdown));
          });
        }
      ],
      // 404页面兜底
      notFoundPage: '_404.md'
    }
  </script>

  <!-- KaTeX 数学公式渲染 -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Docsify 核心与搜索插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
